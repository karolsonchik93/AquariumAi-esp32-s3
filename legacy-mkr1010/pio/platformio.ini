; Check build via PlatformIO (compile verification only).
; The real sketch for the Arduino IDE lives in ../firmware/aquarium_mkr1010/
[env:mkrwifi1010]
platform = atmelsam
board = mkrwifi1010
framework = arduino
lib_deps =
    arduino-libraries/WiFiNINA@^1.8.14
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    arduino-libraries/RTCZero@^1.6.0
build_flags = -Wall
